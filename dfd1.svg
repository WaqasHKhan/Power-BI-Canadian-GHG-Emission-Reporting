<svg width="1100" height="600" viewBox="0 0 1100 600" xmlns="http://www.w3.org/2000/svg">

  <!-- Global styles -->
  <style>
    .title { font-family: Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #222222; }
    .label { font-family: Arial, sans-serif; font-size: 13px; fill: #222222; }
    .small { font-family: Arial, sans-serif; font-size: 11px; fill: #444444; }
    .box { fill: #ffffff; stroke: #444444; stroke-width: 1.5; rx: 6; ry: 6; }
    .store { fill: #f5f5ff; stroke: #444444; stroke-width: 1.5; rx: 6; ry: 6; }
    .process { fill: #e8f6ff; stroke: #1f77b4; stroke-width: 1.5; rx: 10; ry: 10; }
    .fact { fill: #fff4e6; stroke: #ff7f0e; stroke-width: 1.5; rx: 8; ry: 8; }
    .dim { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 1.3; rx: 6; ry: 6; }
    .arrow { stroke: #555555; stroke-width: 1.5; marker-end: url(#arrowhead); fill: none; }
  </style>

  <!-- Arrowhead definition -->
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#555555" />
    </marker>
  </defs>

  <!-- ===================== LEFT SIDE: DFD ===================== -->
  <text x="50" y="40" class="title">Data Flow Diagram (DFD)</text>

  <!-- External Source -->
  <rect x="60" y="90" width="140" height="60" class="box" />
  <text x="130" y="120" text-anchor="middle" class="label">External Source</text>
  <text x="130" y="138" text-anchor="middle" class="small">e.g., CSV, API, DB</text>

  <!-- Process -->
  <rect x="280" y="80" width="200" height="80" class="process" />
  <text x="380" y="110" text-anchor="middle" class="label">Data Processing &amp; ETL</text>
  <text x="380" y="130" text-anchor="middle" class="small">Cleaning · Joins · Aggregations</text>

  <!-- Data Store -->
  <rect x="560" y="90" width="160" height="60" class="store" />
  <text x="640" y="120" text-anchor="middle" class="label">Data Store</text>
  <text x="640" y="138" text-anchor="middle" class="small">Model-ready tables</text>

  <!-- BI Layer / Reports -->
  <rect x="780" y="80" width="220" height="80" class="box" />
  <text x="890" y="110" text-anchor="middle" class="label">Power BI Reports</text>
  <text x="890" y="130" text-anchor="middle" class="small">Dashboards · KPIs · Insights</text>

  <!-- DFD Arrows -->
  <line x1="200" y1="120" x2="280" y2="120" class="arrow" />
  <line x1="480" y1="120" x2="560" y2="120" class="arrow" />
  <line x1="720" y1="120" x2="780" y2="120" class="arrow" />

  <!-- ===================== RIGHT SIDE: STAR SCHEMA ===================== -->
  <text x="50" y="250" class="title">Power BI Data Model (Star Schema)</text>

  <!-- Fact table -->
  <rect x="430" y="320" width="220" height="80" class="fact" />
  <text x="540" y="345" text-anchor="middle" class="label">FactSales</text>
  <text x="540" y="365" text-anchor="middle" class="small">
    Keys: DateKey · CustomerKey · ProductKey · RegionKey
  </text>
  <text x="540" y="383" text-anchor="middle" class="small">
    Measures: SalesAmount · Quantity · Margin
  </text>

  <!-- Dimension: Date -->
  <rect x="120" y="260" width="180" height="70" class="dim" />
  <text x="210" y="285" text-anchor="middle" class="label">DimDate</text>
  <text x="210" y="305" text-anchor="middle" class="small">DateKey · Year · Month · Day</text>

  <!-- Dimension: Customer -->
  <rect x="120" y="380" width="200" height="70" class="dim" />
  <text x="220" y="405" text-anchor="middle" class="label">DimCustomer</text>
  <text x="220" y="425" text-anchor="middle" class="small">CustomerKey · Segment · City</text>

  <!-- Dimension: Product -->
  <rect x="780" y="260" width="200" height="70" class="dim" />
  <text x="880" y="285" text-anchor="middle" class="label">DimProduct</text>
  <text x="880" y="305" text-anchor="middle" class="small">ProductKey · Category · Brand</text>

  <!-- Dimension: Region -->
  <rect x="780" y="380" width="200" height="70" class="dim" />
  <text x="880" y="405" text-anchor="middle" class="label">DimRegion</text>
  <text x="880" y="425" text-anchor="middle" class="small">RegionKey · Country · Province</text>

  <!-- Star schema arrows -->
  <!-- From DimDate to Fact -->
  <line x1="300" y1="295" x2="430" y2="335" class="arrow" />
  <!-- From DimCustomer to Fact -->
  <line x1="320" y1="415" x2="430" y2="365" class="arrow" />
  <!-- From DimProduct to Fact -->
  <line x1="780" y1="295" x2="650" y2="335" class="arrow" />
  <!-- From DimRegion to Fact -->
  <line x1="780" y1="415" x2="650" y2="365" class="arrow" />

  <!-- Caption -->
  <text x="550" y="560" text-anchor="middle" class="small">
    High-level DFD feeding a Power BI star schema model (Fact table with connected dimensions).
  </text>
</svg>
